<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Garage — Madring GP</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#14181d; --muted:#5b6672;
    --accent:#e8002d; --line:#e4e8ec;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}

  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;
    justify-content:space-between;padding:14px 22px;z-index:10;
    background:linear-gradient(#fffffff2,#ffffff00);pointer-events:none}
  header *{pointer-events:auto}
  .brand{font-weight:800;letter-spacing:.12em;font-size:15px}
  .brand span{color:var(--accent)}
  .modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
    transition:.2s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  #teams{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:8px;
    padding:14px 22px 18px;overflow-x:auto;
    background:linear-gradient(#ffffff00,#fffffff2)}
  .team{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;
    border:1px solid #0002}

  #info{position:fixed;top:64px;right:22px;width:240px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:16px;z-index:10;
    box-shadow:0 8px 30px #0001}
  #info h2{font-size:14px;letter-spacing:.06em}
  #info h1{font-size:20px;margin:4px 0 10px}
  .row{display:flex;justify-content:space-between;font-size:12.5px;
    color:var(--muted);padding:5px 0;border-top:1px solid var(--line)}
  .row b{color:var(--ink)}
  #info .bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
  #info .bar i{display:block;height:100%;background:var(--accent);width:0%}

  #loader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:opacity .5s}
  #loader.done{opacity:0;pointer-events:none}
  #loader h1{font-size:22px;letter-spacing:.2em}
  #loader h1 span{color:var(--accent)}
  #bar{width:280px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  #bar i{display:block;height:100%;background:var(--accent);width:0%;transition:.2s}
  #loader p{font-size:12px;color:var(--muted)}
  @media(max-width:720px){
    #info{display:none}
    .modes{gap:5px}
    button{padding:7px 11px;font-size:11px}
  }
</style>
</head>
<body>
<div id="app"></div>

<header>
  <div class="brand">F1 <span>GARAGE</span> · MADRING GP</div>
  <div class="modes">
    <button id="mStudio" class="active">Studio</button>
    <button id="mTrack">On Track</button>
    <button id="mTour">Tour Around Madring</button>
    <button id="mAuto">Auto-rotate</button>
  </div>
</header>

<aside id="info">
  <h2 id="iTeam">SCUDERIA FERRARI</h2>
  <h1 id="iCar">SF-25</h1>
  <div class="row"><span>Season</span><b id="iYear">2025</b></div>
  <div class="row"><span>Power unit</span><b id="iPu">—</b></div>
  <div class="row"><span>Top speed</span><b id="iSpeed">—</b></div>
  <div class="row"><span>Lap @ Madring</span><b id="iLap">—</b></div>
  <div class="bar"><i id="iProg"></i></div>
</aside>

<nav id="teams"></nav>

<div id="loader">
  <h1>F1 <span>GARAGE</span></h1>
  <div id="bar"><i></i></div>
  <p id="loadmsg">Loading models…</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="app.js"></script>
</body>
</html>
